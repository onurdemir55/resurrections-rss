plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.4.2'
}

group = 'io.github.onurdemir55'
version = '2.0-SNAPSHOT'

description = 'Easy-peasy Java library for creating RSS 2.0 feeds, with first-class CDATA support.'

ext.projectUrl = 'https://github.com/onurdemir55/resurrections-rss'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // The only dependency. The feed is written through StAX, whose API ships with the JDK;
    // Woodstox is the implementation, chosen because it can split a CDATA section that
    // contains "]]>" instead of refusing to write it. No Woodstox or StAX type appears in
    // this library's public API, so consumers need it at runtime only.
    implementation 'com.fasterxml.woodstox:woodstox-core:7.2.0'

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // Report real javadoc errors (broken syntax and links) but do not demand
    // a doc comment on every member.
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

checkstyle {
    // 13.x requires a JVM newer than our Java 17 toolchain; 12.x targets Java 17.
    toolVersion = '12.3.1'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    // Checkstyle 12.3.1 cannot parse a module declaration: "no viable alternative at input
    // 'module'". Nothing in the rule set applies to a descriptor anyway.
    exclude '**/module-info.java'
}

tasks.named('compileJava') {
    // javac dislikes a module name component ending in a digit. The name has to match the
    // package root, which contains a GitHub username that ends in one, so the advice cannot
    // be taken and the warning is only noise.
    options.compilerArgs << '-Xlint:-module'
}

test {
    useJUnitPlatform()
    // Lets FeedCorpusRegressionTest re-record its expected output on request. Off by default,
    // because a corpus that re-records itself whenever it disagrees guards nothing.
    systemProperty 'corpus.record', System.getProperty('corpus.record', 'false')
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'resurrections-rss'
                description = project.description
                url = project.projectUrl
                inceptionYear = '2021'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'onurdemir55'
                        name = 'Onur Demir'
                        email = 'onurdemir55@gmail.com'
                        url = 'https://github.com/onurdemir55'
                        // The POM schema has no dedicated field for a social profile, but it
                        // does allow arbitrary developer properties.
                        properties = ['linkedin': 'https://www.linkedin.com/in/onurdemir55/']
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/onurdemir55/resurrections-rss.git'
                    developerConnection = 'scm:git:ssh://git@github.com/onurdemir55/resurrections-rss.git'
                    url = project.projectUrl
                }

                issueManagement {
                    system = 'GitHub Issues'
                    url = "${project.projectUrl}/issues"
                }
            }
        }
    }
}

// Signing is required by Maven Central but must not break local builds.
// Supply an ASCII-armored key through SIGNING_KEY / SIGNING_PASSWORD (or the
// signingKey / signingPassword Gradle properties) to enable it.
signing {
    def signingKey = System.getenv('SIGNING_KEY') ?: findProperty('signingKey')
    def signingPassword = System.getenv('SIGNING_PASSWORD') ?: findProperty('signingPassword')

    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey.toString(), signingPassword.toString())
        sign publishing.publications.maven
    } else {
        logger.lifecycle('Signing is disabled: SIGNING_KEY / SIGNING_PASSWORD not set.')
    }
}

// Bytecode-level bug patterns, which are a different question from whether the tests pass.
// It gates the build: a finding is either a bug worth fixing or an exclusion worth justifying
// in config/spotbugs/exclude.xml, and both are better than a report nobody reads.
spotbugs {
    toolVersion = '4.9.8'
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = false
        html.required = true
        text.required = true
    }
}
